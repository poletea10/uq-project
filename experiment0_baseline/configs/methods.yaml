# Per-method settings (phase0_protocol.md §5). Library defaults unless stated.
hgp:                        # PyMC "Sparse Heteroskedastic GP" example (DTC latent GPs for mu and log sigma)
  n_inducing: 40            # inducing points, evenly spaced on x_range, shared by both latents
  jitter: 1.0e-6            # pm.gp.util.stabilize default
  target_accept: 0.95
  chains: 2
  tune: 500
  draws: 250                # chains x draws = S
  rhat_flag: 1.05
  log_noise_mean_prior: [-2.0, 2.0]   # constant mean of the log-noise latent g: m_g ~ Normal(mu, sigma), standardized-y units

tabiclv2:
  checkpoint: /private/groups/ioannidislab/ajaras/tabicl-dev/tabicl-regressor-v2-20260212.ckpt

iltmv2:                     # Phase 1 model (§5.5): the paper figure's iLTMv2 column
  arm: A2                   # that arm's checkpoints selected on the validation bank (iltm2.inference.BEST,
                            # phase1_protocol.md §9); or give checkpoint_A [checkpoint_E, pair] for any other
                            # checkpoint of any arm (A1, A2, B). After changing it, rerun with --overwrite.

iltmv2_a1:                  # the same model with the A1 arm's selected checkpoints (per-rung figures only)
  arm: A1

iltmv2_b:                   # the same model with arm B's selected checkpoint (fork + both heads; per-rung figures only)
  arm: B
